<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn ChordPro lyrics and chords into clean, one-page A4 PDFs for reading on a tablet. Local-first, no account."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://fedetamburlin.github.io/spartito/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spartito" />
    <meta property="og:title" content="Spartito — one-page song sheets for tablet" />
    <meta
      property="og:description"
      content="Turn ChordPro lyrics and chords into clean, one-page A4 PDFs for reading on a tablet. Local-first, no account."
    />
    <meta property="og:url" content="https://fedetamburlin.github.io/spartito/" />
    <meta property="og:image" content="https://fedetamburlin.github.io/spartito/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spartito — one-page song sheets for tablet" />
    <meta
      name="twitter:description"
      content="Turn ChordPro lyrics and chords into clean, one-page A4 PDFs for reading on a tablet. Local-first, no account."
    />
    <meta name="twitter:image" content="https://fedetamburlin.github.io/spartito/og-image.jpg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Spartito — one-page song sheets for tablet</title>
    <script>
      try {
        var pref = localStorage.getItem('spartito-theme');
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
