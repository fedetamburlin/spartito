name: Feature request
description: Suggest an improvement or a new capability
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: e.g. I need to print A5 sheets, or I want to keep a setlist.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from a user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
